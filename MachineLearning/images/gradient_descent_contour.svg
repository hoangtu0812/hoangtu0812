<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="400" height="320" fill="white"/>
  <defs>
    <marker id="gdA" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" fill="#d62728"/>
    </marker>
  </defs>

  <!-- contour ellipses (levels of a bowl-shaped loss function) -->
  <ellipse cx="200" cy="170" rx="170" ry="120" fill="none" stroke="#cfe3f5" stroke-width="2"/>
  <ellipse cx="200" cy="170" rx="130" ry="90" fill="none" stroke="#9fc9ec" stroke-width="2"/>
  <ellipse cx="200" cy="170" rx="90" ry="60" fill="none" stroke="#6fb0e3" stroke-width="2"/>
  <ellipse cx="200" cy="170" rx="50" ry="32" fill="none" stroke="#3f96da" stroke-width="2"/>
  <circle cx="200" cy="170" r="4" fill="#0b5fa5"/>
  <text x="205" y="165" font-size="12" fill="#0b5fa5" font-weight="bold">cực tiểu w*</text>

  <!-- descending zig-zag path from start to minimum -->
  <polyline points="60,60 110,90 90,130 140,145 125,165 165,172 200,170"
            fill="none" stroke="#d62728" stroke-width="2.5" marker-end="url(#gdA)"/>
  <circle cx="60" cy="60" r="5" fill="#d62728"/>
  <text x="20" y="50" font-size="12" fill="#d62728" font-weight="bold">w₀ (điểm khởi tạo)</text>

  <text x="20" y="20" font-size="14" fill="#111" font-weight="bold">Gradient Descent: đi ngược chiều ∇L để tới cực tiểu</text>
  <text x="20" y="300" font-size="11" fill="#666">mỗi đường cong = 1 mức giá trị loss bằng nhau (đường đồng mức)</text>
</svg>
